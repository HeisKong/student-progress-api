services:
  postgres:
    image: postgres:16-alpine
    container_name: student-progress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_progress
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
